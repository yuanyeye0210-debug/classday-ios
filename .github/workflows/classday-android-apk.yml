name: classday-android-apk

on:
  push:
    branches:
      - main
      - cursor/android-2-9-2-5547
      - 'autoloop/**'
    paths:
      - "android/**"
      - ".github/workflows/classday-android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/classday-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdtools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$HOME/android-sdk/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" \
            "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          if [ ! -e "$HOME/android-sdk/platforms/android-37" ]; then
            ln -s "$HOME/android-sdk/platforms/android-37.0" "$HOME/android-sdk/platforms/android-37"
          fi
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Restore release keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: android/keystore/release.jks
          key: classday-android-release-keystore-v1

      - name: Prepare signing key
        env:
          CLASSDAY_KEYSTORE_BASE64: ${{ secrets.CLASSDAY_KEYSTORE_BASE64 }}
          CLASSDAY_STORE_PASSWORD: ${{ secrets.CLASSDAY_STORE_PASSWORD }}
          CLASSDAY_KEY_ALIAS: ${{ secrets.CLASSDAY_KEY_ALIAS }}
          CLASSDAY_KEY_PASSWORD: ${{ secrets.CLASSDAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          STORE_PASS="${CLASSDAY_STORE_PASSWORD:-classday-android-release}"
          [ -n "$STORE_PASS" ] || STORE_PASS="classday-android-release"
          ALIAS="${CLASSDAY_KEY_ALIAS:-classday}"
          [ -n "$ALIAS" ] || ALIAS="classday"
          KEY_PASS="${CLASSDAY_KEY_PASSWORD:-$STORE_PASS}"
          [ -n "$KEY_PASS" ] || KEY_PASS="$STORE_PASS"
          if [ -n "${CLASSDAY_KEYSTORE_BASE64}" ]; then
            printf '%s' "$CLASSDAY_KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          elif [ ! -f android/keystore/release.jks ]; then
            keytool -genkeypair -v \
              -keystore android/keystore/release.jks \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Classday, OU=Heptara, O=Classday, L=Shanghai, ST=Shanghai, C=CN"
          fi

      - name: Unit tests and release APK
        working-directory: android
        env:
          CLASSDAY_STORE_PASSWORD: ${{ secrets.CLASSDAY_STORE_PASSWORD || 'classday-android-release' }}
          CLASSDAY_KEY_ALIAS: ${{ secrets.CLASSDAY_KEY_ALIAS || 'classday' }}
          CLASSDAY_KEY_PASSWORD: ${{ secrets.CLASSDAY_KEY_PASSWORD || secrets.CLASSDAY_STORE_PASSWORD || 'classday-android-release' }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew test assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Classday-android-v2.9.2
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
