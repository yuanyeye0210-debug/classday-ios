name: Classday
options:
  bundleIdPrefix: com.classday
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  ClassdayCore:
    path: ClassdayCore
targets:
  Classday:
    type: application
    platform: iOS
    sources:
      - path: ClassdayApp
    dependencies:
      - package: ClassdayCore
        product: ClassdayCore
      - target: ClassdayWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.classday.app
        INFOPLIST_FILE: Config/Classday-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/Classday.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  ClassdayWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ClassdayWidget
    dependencies:
      - package: ClassdayCore
        product: ClassdayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.classday.app.widget
        INFOPLIST_FILE: Config/ClassdayWidget-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/ClassdayWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  Classday:
    build:
      targets:
        Classday: all
    run:
      config: Debug
